[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Reminders, expiries, the 3-month check-in, the 12-month flag and document
# deletion. Scheduled functions can't be called from outside in production.
[functions."daily-tasks"]
  schedule = "@daily"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Team tool: never indexed, never cached.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"

# The client's private page: never indexed, never cached, no referrer.
[[headers]]
  for = "/client*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"

# The client's feedback form (R21).
[[headers]]
  for = "/feedback*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"

# Her decision pages for an introduction request: never indexed, never cached.
[[headers]]
  for = "/vi/gioi-thieu*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/introduction*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"

# Her private profile page: never indexed; no referrer ever leaves it.
[[headers]]
  for = "/vi/ho-so*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/my-profile*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "https://hu.netlify.app/*"
  to = "https://heritage-union.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/founding-circle"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/vi/founding-circle"
  to = "/vi/"
  status = 301
  force = true

# TODO(James): remove these four redirects when signed consent from John and
# Adam is held. Success Stories is hidden until then; the page files are unchanged.
[[redirects]]
  from = "/success-stories"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/success-stories.html"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/vi/success-stories"
  to = "/vi/"
  status = 302
  force = true

[[redirects]]
  from = "/vi/success-stories.html"
  to = "/vi/"
  status = 302
  force = true
